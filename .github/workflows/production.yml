# Delivers production on every merge to main that touches what is deployed
# (docs/SDLC.md), and writes the tag and the GitHub Release of the version once
# production serves it. A merge of documentation or governance starts nothing.
name: Production

on:
  push:
    branches: [main]
    paths:
      - 'memorysmithapp-backend/**'
      - 'memorysmithapp-frontend/**'
      - 'memorysmithapp-infra/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  # To run a delivery of main again, after a failure that was not the code's.
  workflow_dispatch:

permissions:
  contents: read

# Two merges deliver in order, never together, and never cancel each other.
concurrency:
  group: deliver-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  release-checks:
    name: Release checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # The whole history and the tags: a version already tagged is not released twice.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C memorysmithapp-infra release-checks

  quality:
    name: Quality
    needs: release-checks
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - run: node --test scripts/*.test.mjs
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm depcruise
      - run: pnpm -r --if-present test

  deliver:
    name: Deliver production
    needs: quality
    runs-on: ubuntu-26.04
    environment: production
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: production-${{ github.run_id }}
          role-duration-seconds: 7200
      - name: Deliver
        env:
          # Who the alarms of production notify (#267): a variable of
          # this environment, never a line of cdk.json, because the repository is
          # public. Without it the delivery refuses before it builds anything.
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
        run: pnpm -C memorysmithapp-infra deliver --environment production

  release:
    name: Tag and release
    needs: deliver
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: pnpm -s -C memorysmithapp-infra publish-release
