# The quality gate (architecture-guide.md, section 20): the sequence a person
# used to run by hand before pushing, on every pull request and on every push
# to a release branch. It is the required status check of main.
name: CI

on:
  pull_request:
  push:
    branches: ['release/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm depcruise
      - run: pnpm -r --if-present test
      - run: pnpm -C memorysmith-frontend build
