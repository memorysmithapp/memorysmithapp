# Continuous integration (architecture-guide.md, section 20).
#
# No step here is optional. The dependency rule in particular is what keeps
# "hexagonal" from becoming folder naming, and it is also where the one-way
# dependency between the three top-level projects is verified.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint, typecheck and dependency rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format
      - name: Typecheck
        run: pnpm typecheck
      # The build breaks if domain/ imports the AWS SDK.
      - name: Dependency rule
        run: pnpm depcruise

  backend-unit:
    name: Backend unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Domain and use cases
        run: pnpm -r --if-present test

  backend-adapters:
    name: Adapter tests against DynamoDB Local and MinIO
    runs-on: ubuntu-latest
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
      S3_ENDPOINT: http://localhost:9000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: memorysmith
      AWS_SECRET_ACCESS_KEY: memorysmith-local
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # From the repository's own docker-compose.yml, and not from a service
      # container block: one definition of the dependencies, shared with the
      # machine of whoever runs the suite locally. --wait blocks until both
      # healthchecks pass, so the harness never races the containers.
      - name: Start the local dependencies
        run: docker compose up -d --wait
      - name: Adapters
        run: pnpm -r --if-present test:adapters
      - name: Dependency logs
        if: failure()
        run: docker compose logs --no-color

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -C memorysmith-frontend build

  infra:
    name: CDK synth
    runs-on: ubuntu-latest
    # Always runs: infra references backend and frontend artifacts, so a change
    # in either can invalidate the synth.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Synth
        run: pnpm -C memorysmith-infra synth
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
          CDK_DEFAULT_REGION: us-east-1
