# The organisation's own packages, and nothing else (#291). The reading page
# draws a note with @memorysmithapp/markdown-renderer and follows its latest
# release: the range in package.json admits every 0.x, and the lockfile is what
# pins a version, so a new release arrives as a pull request that changes the
# lockfile, where CI and the review decide.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: '@memorysmithapp/*'
    versioning-strategy: lockfile-only
    commit-message:
      prefix: chore(deps)
