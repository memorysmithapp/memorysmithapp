name: Usage feedback
description: Tell us about a friction you felt using MemorySmith. You do not need to know what the solution is.
title: '[feedback] '
labels: ['feedback']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. Two things before you start.

        **Answer in whatever language you prefer.** The repository is written in English,
        and that has nothing to do with how you tell us what happened to you.

        **This repository is public.** Do not paste real content from your notes, customer
        names, business data or anything confidential. Describe the situation with invented
        examples; it works just as well for us.

        **If you saw data from another account**, or anything that looks like an isolation
        failure, **do not open an issue**. Use the private channel described in
        [`SECURITY.md`](https://github.com/memorysmithapp/memorysmithapp/blob/main/SECURITY.md).

  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: The real task, in your own words. Not what you think the product should have.
      placeholder: |
        For example: I was creating the tenth meeting note of the week and wanted it to be
        born with the same sections as the others.
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: What the product actually did.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How did you work around it?
      description: |
        If you found a way, tell us which. The workaround usually says more about the size
        of the pain than any other answer in this form.
    validations:
      required: false

  - type: dropdown
    id: frequency
    attributes:
      label: How often does this happen to you?
      options:
        - Every time I use it
        - Several times a week
        - Now and then
        - It happened once
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - In the web interface
        - In the MCP connector, using an agent
        - During installation or deployment
        - In the documentation (README)
        - Somewhere else / I cannot tell
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: If you were solving it, what would you do?
      description: |
        Optional, and feel free to leave it blank. We ask last and on purpose: your
        description of the friction is worth more than your proposed solution, and we often
        end up on a different path from the one suggested here. That is not the request
        being ignored; it is the friction being taken seriously.
    validations:
      required: false

  - type: checkboxes
    id: confidentiality
    attributes:
      label: Confirmation
      options:
        - label: I have not pasted confidential content from my notes into this issue.
          required: true
