packages:
  - memorysmith-frontend
  - memorysmith-backend
  - memorysmith-backend/packages/*
  - memorysmith-backend/services/*
  - memorysmith-backend/apps/*
  - memorysmith-infra
  # The Markdown specification the product reads, declared once as data. It is
  # a package so the contracts can derive the notation from it and so its own
  # check runs with every other suite; it follows the version of the product.
  - docs/markdown-spec

allowBuilds:
  esbuild: true
